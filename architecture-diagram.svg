<svg aria-label="Complete diagram of Vetter et al. diffusion model with forward process, trained denoiser, reverse process and scientific adaptations" class="architecture-svg" width="1920" height="1160" id="architectureSvg" role="img" viewbox="0 0 1920 1160" xmlns="http://www.w3.org/2000/svg"><style>
.arch-region{fill:#0a1824;stroke:#244052;stroke-width:1.4}.arch-network-region{fill:#0e2435;stroke:#245772;stroke-dasharray:8 6}
.arch-lane-label{font:600 21px Arial,sans-serif;letter-spacing:3px;fill:#8caabb}.arch-wire{fill:none;stroke:#64899d;stroke-width:3.1;opacity:.8}.arch-wire-dash{stroke:#0098ff;stroke-dasharray:8 8;opacity:.7}
.arch-node rect{fill:#152535;stroke:#466378;stroke-width:1.5}.arch-node.is-adaptation rect{fill:#0d3044;stroke:#0873b0;stroke-width:2}
.arch-node-title{font:600 23px Arial,sans-serif;fill:#fff}.arch-node-sub{font:400 17px Arial,sans-serif;fill:#bdd5e6}.arch-node-detail{font:400 14px Arial,sans-serif;fill:#83a5b7}.arch-difference-dot{fill:#0098ff}.arch-legend{font:400 16px Arial,sans-serif;fill:#68b4e4;letter-spacing:1px}</style><defs><pattern height="25" id="archDots" patternunits="userSpaceOnUse" width="25" x="0" y="0"><circle cx="1" cy="1" fill="#ffffff" opacity=".085" r="1"></circle></pattern><marker id="archArrow" markerheight="9" markerwidth="9" orient="auto" refx="6" refy="3"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#7591a7" stroke-width="1.4"></path></marker></defs><rect fill="#071019" height="1160" width="1920"></rect><rect fill="url(#archDots)" height="1160" width="1920"></rect><rect class="arch-region" height="445" rx="23" width="1840" x="55" y="105"></rect><rect class="arch-region arch-network-region" height="262" rx="22" width="1430" x="355" y="570"></rect><rect class="arch-region" height="264" rx="23" width="1840" x="55" y="858"></rect><text class="arch-lane-label" x="85" y="150">01 · FORWARD / TRAINING</text><text class="arch-lane-label" x="395" y="606">02 · DENOISER  εθ (xₜ, t, c) · FULL TEMPORAL RESOLUTION</text><text class="arch-lane-label" x="85" y="896">03 · REVERSE / SAMPLING</text><path class="arch-wire" d="M302,235 C346,235 346,235 390,235" marker-end="url(#archArrow)"></path><path class="arch-wire" d="M638,235 C684,235 684,235 730,235" marker-end="url(#archArrow)"></path><path class="arch-wire" d="M196,393 C355,393 355,290 514,290" marker-end="url(#archArrow)"></path><path class="arch-wire" d="M838,290 C838,290 838,390 838,390" marker-end="url(#archArrow)"></path><path class="arch-wire" d="M615,703 C650,703 650,703 685,703" marker-end="url(#archArrow)"></path><path class="arch-wire" d="M912,703 C948,703 948,703 983,703" marker-end="url(#archArrow)"></path><path class="arch-wire" d="M1157,703 C1190,703 1190,703 1223,703" marker-end="url(#archArrow)"></path><path class="arch-wire" d="M1465,703 C1500,703 1500,703 1535,703" marker-end="url(#archArrow)"></path><path class="arch-wire" d="M332,985 C412,985 412,985 492,985" marker-end="url(#archArrow)"></path><path class="arch-wire" d="M814,985 C924,985 924,985 1034,985" marker-end="url(#archArrow)"></path><path class="arch-wire" d="M1318,985 C1413,985 1413,985 1508,985" marker-end="url(#archArrow)"></path><path class="arch-wire" d="M837,290 L837,348 L512,348 L512,645" marker-end="url(#archArrow)"></path><path class="arch-wire arch-wire-dash" d="M837,500 L837,645" marker-end="url(#archArrow)"></path><path class="arch-wire arch-wire-dash" d="M1632,645 L1632,492" marker-end="url(#archArrow)"></path><path class="arch-wire arch-wire-dash" d="M302,444 L360,444 L360,535 L1550,535 L1550,442" marker-end="url(#archArrow)"></path><path class="arch-wire arch-wire-dash" d="M1632,761 L1632,842 L653,842 L653,935" marker-end="url(#archArrow)"></path><g aria-label="Observed window: EEG x₀" class="arch-node" data-arch-node="raw" role="button" tabindex="0" transform="translate(90 180)"><rect height="110" rx="12" width="212"></rect><text class="arch-node-title" x="17" y="35">EEG x₀</text><text class="arch-node-sub" x="17" y="67">Observed window</text><text class="arch-node-detail" x="17" y="92">C × L samples</text></g><g aria-label="Noise process: ε ~ 𝒩(0,Σ)" class="arch-node is-adaptation" data-arch-node="noise" role="button" tabindex="0" transform="translate(90 393)"><rect height="110" rx="12" width="212"></rect><text class="arch-node-title" x="17" y="35">ε ~ 𝒩(0,Σ)</text><text class="arch-node-sub" x="17" y="67">Noise process</text><text class="arch-node-detail" x="17" y="92">White / OU</text><circle class="arch-difference-dot" cx="194" cy="18" r="6"></circle></g><g aria-label="Forward diffusion: q(xₜ | x₀)" class="arch-node" data-arch-node="forward" role="button" tabindex="0" transform="translate(390 180)"><rect height="110" rx="12" width="248"></rect><text class="arch-node-title" x="17" y="35">q(xₜ | x₀)</text><text class="arch-node-sub" x="17" y="67">Forward diffusion</text><text class="arch-node-detail" x="17" y="92">Fixed schedule βₜ</text></g><g aria-label="Noisy sample: xₜ" class="arch-node" data-arch-node="noisy" role="button" tabindex="0" transform="translate(730 180)"><rect height="110" rx="12" width="215"></rect><text class="arch-node-title" x="17" y="35">xₜ</text><text class="arch-node-sub" x="17" y="67">Noisy sample</text><text class="arch-node-detail" x="17" y="92">Training input</text></g><g aria-label="Step + condition: t, c" class="arch-node" data-arch-node="time" role="button" tabindex="0" transform="translate(730 390)"><rect height="110" rx="12" width="215"></rect><text class="arch-node-title" x="17" y="35">t, c</text><text class="arch-node-sub" x="17" y="67">Step + condition</text><text class="arch-node-detail" x="17" y="92">Optional conditioning</text></g><g aria-label="Input projection: Conv 1D" class="arch-node" data-arch-node="conv_in" role="button" tabindex="0" transform="translate(405 645)"><rect height="116" rx="12" width="210"></rect><text class="arch-node-title" x="17" y="35">Conv 1D</text><text class="arch-node-sub" x="17" y="67">Input projection</text><text class="arch-node-detail" x="17" y="92">C → C · d</text></g><g aria-label="Structured multi-scale: Long convolution" class="arch-node is-adaptation" data-arch-node="long" role="button" tabindex="0" transform="translate(685 645)"><rect height="116" rx="12" width="227"></rect><text class="arch-node-title" x="17" y="35">Long convolution</text><text class="arch-node-sub" x="17" y="67">Structured multi-scale</text><text class="arch-node-detail" x="17" y="92">FFT accelerated</text><circle class="arch-difference-dot" cx="209" cy="18" r="6"></circle></g><g aria-label="Nonlinearity: GELU + Norm" class="arch-node" data-arch-node="gelu" role="button" tabindex="0" transform="translate(983 645)"><rect height="116" rx="12" width="174"></rect><text class="arch-node-title" x="17" y="35">GELU + Norm</text><text class="arch-node-sub" x="17" y="67">Nonlinearity</text><text class="arch-node-detail" x="17" y="92">Layer / batch norm</text></g><g aria-label="Linear interactions: Channel mixing" class="arch-node is-adaptation" data-arch-node="mix" role="button" tabindex="0" transform="translate(1223 645)"><rect height="116" rx="12" width="242"></rect><text class="arch-node-title" x="17" y="35">Channel mixing</text><text class="arch-node-sub" x="17" y="67">Linear interactions</text><text class="arch-node-detail" x="17" y="92">Sparse off-diagonal</text><circle class="arch-difference-dot" cx="224" cy="18" r="6"></circle></g><g aria-label="Output projection: Conv 1D" class="arch-node" data-arch-node="conv_out" role="button" tabindex="0" transform="translate(1535 645)"><rect height="116" rx="12" width="194"></rect><text class="arch-node-title" x="17" y="35">Conv 1D</text><text class="arch-node-sub" x="17" y="67">Output projection</text><text class="arch-node-detail" x="17" y="92">εθ (xₜ,t,c)</text></g><g aria-label="Noise prediction loss: L(θ)" class="arch-node is-adaptation" data-arch-node="loss" role="button" tabindex="0" transform="translate(1564 392)"><rect height="100" rx="12" width="255"></rect><text class="arch-node-title" x="17" y="35">L(θ)</text><text class="arch-node-sub" x="17" y="67">Noise prediction loss</text><text class="arch-node-detail" x="17" y="92">Σ⁻¹ if correlated</text><circle class="arch-difference-dot" cx="237" cy="18" r="6"></circle></g><g aria-label="Sampling prior: xT ~ 𝒩(0,Σ)" class="arch-node is-adaptation" data-arch-node="prior" role="button" tabindex="0" transform="translate(95 935)"><rect height="100" rx="12" width="237"></rect><text class="arch-node-title" x="17" y="35">xT ~ 𝒩(0,Σ)</text><text class="arch-node-sub" x="17" y="67">Sampling prior</text><text class="arch-node-detail" x="17" y="92">White / OU</text><circle class="arch-difference-dot" cx="219" cy="18" r="6"></circle></g><g aria-label="Reverse denoising: pθ(xₜ₋₁ | xₜ)" class="arch-node" data-arch-node="reverse" role="button" tabindex="0" transform="translate(492 935)"><rect height="100" rx="12" width="322"></rect><text class="arch-node-title" x="17" y="35">pθ(xₜ₋₁ | xₜ)</text><text class="arch-node-sub" x="17" y="67">Reverse denoising</text><text class="arch-node-detail" x="17" y="92">Repeat t = T … 1</text></g><g aria-label="Synthetic EEG: x̂₀" class="arch-node" data-arch-node="generated" role="button" tabindex="0" transform="translate(1034 935)"><rect height="100" rx="12" width="284"></rect><text class="arch-node-title" x="17" y="35">x̂₀</text><text class="arch-node-sub" x="17" y="67">Synthetic EEG</text><text class="arch-node-detail" x="17" y="92">Validated signal statistics</text></g><g aria-label="Downstream applications: pθ(x | c)" class="arch-node" data-arch-node="applications" role="button" tabindex="0" transform="translate(1508 935)"><rect height="100" rx="12" width="296"></rect><text class="arch-node-title" x="17" y="35">pθ(x | c)</text><text class="arch-node-sub" x="17" y="67">Downstream applications</text><text class="arch-node-detail" x="17" y="92">Generation · imputation</text></g><text class="arch-legend" x="93" y="1090">● BLUE NODE MARKER — VETTER ET AL. ADAPTATION / OPTION</text></svg>